[package]
name = "relativelylight"
version = "0.3.1"
edition = "2021"
license = "MIT"
description = "Web-app building blocks: an auto-generated, server-rendered CRUD admin UI over your ORM entities (no JavaScript framework, no per-model code), plus sessions, user authentication (password, TOTP 2FA, OIDC SSO), and user management."
repository = "https://github.com/tmshlvck/relativelylight"
homepage = "https://github.com/tmshlvck/relativelylight"
readme = "../README.md"
keywords = ["crud", "admin", "seaorm", "axum", "auth"]
categories = ["web-programming", "database", "authentication"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
http = "1"                       # the `authz` gate trait takes `http::HeaderMap` (no axum needed)
sea-orm = { workspace = true, optional = true }
axum = { version = "0.8", optional = true }
askama = { version = "0.13", optional = true }
csv = { version = "1", optional = true }
jiff = { version = "0.2", optional = true }   # IANA tz database: render a UTC epoch in the user's zone, and read a `datetime-local` back
argon2 = { version = "0.5", optional = true }
rand_core = { version = "0.6", features = ["getrandom"], optional = true }
axum-extra = { version = "0.10", features = ["cookie"], optional = true }
time = { version = "0.3", optional = true }
totp-rs = { version = "5.7", features = ["qr", "gen_secret"], optional = true } # TOTP 2FA: secret, otpauth URL, QR
sha2 = { version = "0.10", optional = true }       # hash TOTP recovery codes (high-entropy → a fast hash, see auth::recovery)
openidconnect = { version = "4", optional = true } # OIDC relying-party (SSO); default async reqwest + rustls
regex = { version = "1", optional = true }         # SSO username → group mapping rules
base64 = { version = "0.22", optional = true }     # decode the verified ID-token payload; txn cookie
ipnet = "2"                      # CIDR allow-lists (net::parse_nets / in_nets, the lockout's ip_allow)
# --- blob ---------------------------------------------------------------------------------------
tokio = { workspace = true, features = ["fs", "io-util"], optional = true }  # FsBackend: streaming + atomic rename
uuid = { version = "1", features = ["v7", "serde"], optional = true }        # HandleId — time-ordered (RFC 9562)
tokio-util = { version = "0.7", features = ["io"], optional = true }         # io::StreamReader — an axum body as AsyncRead
bytes = { version = "1", optional = true }                                   # StreamReader's items must be `Buf`
futures-core = { version = "0.3", optional = true }                          # the `Stream` in BlobBackend::list
multer = { version = "3", optional = true }                                  # streaming multipart — blob-ui uploads never land in memory
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"], optional = true }  # thumbnails: decode common formats, encode PNG/JPEG

[dev-dependencies]
tokio = { workspace = true }
sea-orm = { workspace = true, features = ["sqlx-sqlite", "runtime-tokio-rustls"] } # in-memory SQLite for the auth/engine tests
tower = { version = "0.5", features = ["util"] }  # ServiceExt::oneshot — drive the routers without a socket
axum = "0.8"
# The fake OIDC provider the SSO callback tests run against (auth/sso_tests.rs): a signing key generated
# per test process, and the timestamps an ID token's claims are built from.
rsa = { version = "0.9", features = ["std"] }
chrono = "0.4"
tempfile = "3"   # a scratch root for the FsBackend tests

[features]
default = ["crud", "axum"]
crud = ["dep:sea-orm"]        # the CRUD engine + SeaORM backend (the `crud` module)
axum = ["dep:axum"]           # the HTTP router/handlers
# `ui` needs the **`axum` feature**, not merely askama: it parses a request's query string into a
# `ViewState`, decodes posted form bodies, and answers with `axum::Response`. Depending on askama alone
# would leave `ui`-without-`axum` a combination that doesn't compile — the mistake `auth` already made
# once, and one `--all-features` cannot catch.
ui = ["dep:askama", "crud", "axum", "tz"]  # the server-rendered admin components (Table, Form, Admin)
csv = ["dep:csv", "crud", "tz"]  # export formats datetime columns in the caller's zone, so it needs `tz`
tz = ["dep:jiff"]             # timezone-aware rendering of integer-UTC timestamps (the `time` module)
# `auth` needs the **`axum` feature**, not merely the axum dependency: it serves routes, and it reads the
# caller's address from `middleware::RealIp`, which is `#[cfg(feature = "axum")]`. Depending on `dep:axum`
# alone left `auth`-without-`axum` a combination that didn't compile (and `--all-features` can't catch that,
# because it turns everything on).
auth = ["csrf", "axum", "dep:sea-orm", "dep:axum-extra", "dep:argon2", "dep:totp-rs", "dep:sha2"] # sessions/login + TOTP 2FA + Authz gate
csrf = ["axum", "dep:rand_core", "dep:axum-extra", "dep:time"] # the double-submit CSRF token (the `csrf` module); implied by `auth`
sso = ["auth", "dep:openidconnect", "dep:regex", "dep:base64"] # OIDC single sign-on (Google / Okta / corporate) + group mapping
# Content-addressed file storage: a stable handle + an immutable version chain over digest-addressed
# content (docs/BLOBSTORE.md). Depends on neither `crud` nor `auth` — ownership and per-document access
# live in the app's own link table (BLOBSTORE.md §9), which is what keeps this list short.
blob = ["dep:sea-orm", "dep:tokio", "dep:sha2", "dep:uuid", "dep:tokio-util", "dep:bytes", "dep:futures-core"]
# The server-rendered blob components: viewer, upload form, admin actions, and the response builder.
# Implies `ui` (so `crud` + `axum` + `tz`) because it renders fragments into the same shell.
blob-ui = ["blob", "ui", "dep:multer"]
# Derived renderings of image blobs. Headless — needs no `ui`.
blob-thumbnail = ["blob", "dep:image"]
validate-regex = ["dep:regex"]   # validate::regex_match (reuses the regex dep)
validate-base64 = ["dep:base64"] # validate::base64 / base64_url (reuses the base64 dep)
