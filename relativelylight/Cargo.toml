[package]
name = "relativelylight"
version = "0.5.0"
edition = "2021"
rust-version = "1.89"           # webauthn-rs 0.6 (askama 0.16 and totp-rs 6 need 1.88)
license = "MIT"
description = "Web-app building blocks: an auto-generated, server-rendered CRUD admin UI over your ORM entities (no JavaScript framework, no per-model code), plus sessions, user authentication (password, TOTP 2FA, OIDC SSO), and user management."
repository = "https://github.com/tmshlvck/relativelylight"
homepage = "https://github.com/tmshlvck/relativelylight"
readme = "../README.md"
keywords = ["crud", "admin", "seaorm", "axum", "auth"]
categories = ["web-programming", "database", "authentication"]

# docs.rs builds the default features unless told otherwise, which left out `sso`, `passkeys` and
# `files`. `docsrs` turns on `doc_cfg`, which labels each item with the feature it needs.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
http = "1"                       # the `authz` gate trait takes `http::HeaderMap` (no axum needed)
# `with-chrono` binds a `Date` as a date; `serde` makes SeaORM's `ChronoUnixTimestamp` (an instant as
# Unix seconds) serialize as an `i64`, which the engine reads every model through (docs/TIME.md §1).
sea-orm = { workspace = true, features = ["with-chrono", "serde"] }
axum = "0.8"                     # always on: every surface is an axum handler or extractor
askama = { version = "0.16", default-features = false, features = ["derive", "std"] } # no `config`: it reads askama.toml with the unmaintained basic-toml
csv = "1"                        # the table's import and export
jiff = "0.2"                    # IANA tz database: render a UTC epoch in the user's zone, and read a `datetime-local` back
argon2 = "0.6"                   # password hashing
getrandom = "0.4"                # the OS CSPRNG: CSRF/session tokens, recovery codes
axum-extra = { version = "0.12", features = ["cookie"] } # the CSRF and session cookies
time = "0.3"                     # a cookie's `Max-Age` (axum-extra's cookie type)
totp-rs = { version = "6", features = ["qr", "gen_secret"] } # TOTP 2FA: secret, otpauth URL, QR
sha2 = "0.11"                                       # hash TOTP recovery codes (high-entropy → a fast hash, see auth::recovery)
openidconnect = { version = "4", optional = true } # OIDC relying-party (SSO); default async reqwest + rustls
regex = "1"                                        # validate::regex_match; SSO username → group mapping rules
base64 = "0.23"                                    # validate::base64; the SSO ID-token payload and txn cookie
webauthn-rs = { version = "0.6.2", optional = true, features = ["conditional-ui", "danger-allow-state-serialisation", "danger-credential-internals"] } # passkeys
webauthn-rs-proto = { version = "0.6.2", optional = true } # its wire types: asking for a discoverable credential
ipnet = "2"                      # CIDR allow-lists (net::parse_nets / in_nets, the lockout's ip_allow)
# --- files --------------------------------------------------------------------------------------
tokio = { workspace = true, optional = true }                                # io::AsyncRead — what a Download is read from
tokio-util = { version = "0.7", features = ["io"], optional = true }         # io::ReaderStream — a reader as a response body
multer = { version = "3", optional = true }                                  # streaming multipart — uploads never land in memory

[dev-dependencies]
# Software authenticators for the passkey tests (auth/passkey_tests.rs): `SoftPasskey`, and `SoftToken`,
# which attests with a CA of its own. Plus the CBOR codec to make a registration look synced, and the
# proto type that names a credential in a request (the soft authenticators can't discover one).
webauthn-authenticator-rs = { version = "0.6.2", features = ["softpasskey", "softtoken"] }
webauthn-rs-proto = "0.6.2"
serde_cbor_2 = "0.13"
crypto-glue = "0.2.2"                 # the soft token's attestation CA as PEM, for `Passkeys::attestation_ca`
tokio = { workspace = true }
sea-orm = { workspace = true, features = ["sqlx-sqlite", "runtime-tokio-rustls"] } # in-memory SQLite for the auth/engine tests
tower = { version = "0.5", features = ["util"] }  # ServiceExt::oneshot — drive the routers without a socket
axum = "0.8"
# The fake OIDC provider the SSO callback tests run against (auth/sso_tests.rs): a signing key generated
# per test process, and the timestamps an ID token's claims are built from.
rsa = { version = "0.9", features = ["std"] }
rand_core = { version = "0.6", features = ["getrandom"] } # the RNG rsa 0.9 generates that key with
chrono = "0.4"

[features]
# The crate is the CRUD engine, its admin UI, CSV, timezones and `auth`: an admin of structured data
# needs users and gates, and the users live in the database the admin shows. What stays optional
# brings a large dependency tree or a module an app may well not use.
default = []
# OIDC single sign-on (Google / Okta / corporate) + group mapping: an HTTP client stack of its own.
sso = ["dep:openidconnect"]
# Passkeys (WebAuthn): enrolment on /profile, sign-in, a second factor, re-authentication (docs/AUTH.md
# §5l). The tables are `auth`'s and exist without it. `webauthn-rs` is pure Rust; the features keep a
# ceremony's state in our database row and read a credential's backup flags.
passkeys = ["dep:webauthn-rs", "dep:webauthn-rs-proto"]
# Files on a page: the streaming upload reader, the response builder and the upload/preview/thumbnail
# components (docs/FILES.md). Storage, naming and listing are the app's.
files = ["dep:tokio", "dep:tokio-util", "dep:multer"]
