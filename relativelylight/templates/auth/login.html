{%- import "auth/_macros.html" as m -%}
<form method="post" action="/login">
  {{ m::csrf(csrf) }}
  {{ m::alert(error, success) }}
  <div class="mb-3">
    <label class="form-label" for="rl-username">Username</label>
    <input class="form-control" id="rl-username" name="username" autofocus autocomplete="username">
  </div>
  <div class="mb-3">
    <label class="form-label" for="rl-password">Password</label>
    <input class="form-control" id="rl-password" name="password" type="password" autocomplete="current-password">
  </div>
  <button class="btn btn-primary" type="submit">Log in</button>
</form>
{%- if passkeys %}
{#- A separate post: the challenge is created when the user asks for one, never on a page view, so
    anonymous traffic can't write rows. #}
<form method="post" action="/login/passkey" class="mt-3">
  {{ m::csrf(csrf) }}
  <button class="btn btn-outline-primary w-100" type="submit">Sign in with a passkey</button>
</form>
{%- endif %}
