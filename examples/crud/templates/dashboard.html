{#- A page of the app's own: four numbers and one embedded table. The library renders the table; the
    layout, the wording and the queries behind the numbers are all the app's. -#}
<div class="row g-3 mb-4">
  {% for card in cards %}
  <div class="col-6 col-lg-3">
    <div class="card shadow-sm h-100">
      <div class="card-body">
        <div class="text-muted small text-uppercase">{{ card.0 }}</div>
        <div class="display-6">{{ card.1 }}</div>
      </div>
    </div>
  </div>
  {% endfor %}
</div>

<div class="card shadow-sm">
  <div class="card-body">{{ recent|safe }}</div>
</div>
