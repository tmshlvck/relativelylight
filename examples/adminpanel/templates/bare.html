<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Choose</title>
  <!-- The picker's page, inside the dialog's iframe: the shell's colour mode and stylesheet, and no
       navigation — the page that opened the dialog reads the choices from here. -->
  <script>(function(){try{var s=localStorage.getItem('theme');}catch(e){}var t=s||((window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light');document.documentElement.setAttribute('data-bs-theme',t);})();</script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>{{ css|safe }}</style>
</head>
<body class="p-2">
  {{ body|safe }}
</body>
</html>
