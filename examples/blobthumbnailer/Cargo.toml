[package]
name = "blobthumbnailer-example"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
# Note: no `blob-thumbnail` feature — there isn't one. Thumbnailing is *this example's* code.
relativelylight = { path = "../../relativelylight", features = ["blob-ui"] }
axum = "0.8"
async-trait = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
sea-orm = { workspace = true, features = ["sqlx-sqlite", "runtime-tokio-rustls"] }
tokio = { workspace = true, features = ["net"] }
