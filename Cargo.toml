[workspace]
resolver = "2"
members = ["relativelylight", "examples/model", "examples/audit", "examples/crud", "examples/relationfield", "examples/adminpanel", "examples/auth", "examples/blob", "examples/blobthumbnailer"]

[workspace.dependencies]
sea-orm = { version = "2.0", features = ["macros", "with-json", "with-uuid"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
async-trait = "0.1"
